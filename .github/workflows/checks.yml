name: checks

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build -o "${RUNNER_TEMP}/skp" ./cmd/skp
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Test Homebrew publisher
        if: runner.os == 'Linux'
        run: python3 -m unittest scripts/publish_homebrew_test.py
